appId: com.openclaw.cs.desktop
# ASCII productName — Chinese name alone makes NSIS dialogs awkward; shortcut keeps Chinese.
productName: OpenClaw-CS
# Keep exe short & exact; installer artifact MUST NOT contain this stem as substring
# (electron-builder substring match: OpenClaw-CS-Setup*.exe → false "cannot be closed").
executableName: OpenClaw-CS
copyright: OpenClaw CS
directories:
  output: ../../dist-pack/desktop
  buildResources: build
files:
  - main.js
  - preload.js
  - ensure-electron.js
  - package.json
  - ui/**/*
extraResources:
  - from: ../../dist-pack/desktop-stage/openclaw-cs
    to: openclaw-cs
  - from: ../../dist-pack/desktop-stage/openclaw-portable
    to: openclaw-portable
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
win:
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  # Deliberately NOT "OpenClaw-CS-Setup-*" — that substring-matches OpenClaw-CS.exe
  artifactName: OpenClawDesktop-Setup-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OpenClaw客服一体端
  language: 2052
  # relative to buildResources (apps/desktop/build)
  include: installer.nsh

